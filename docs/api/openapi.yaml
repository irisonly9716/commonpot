openapi: 3.1.0
info:
  title: CommonPot API
  version: 0.1.0
  description: The CommonPot API will be documented here as endpoints are implemented.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.commonpot.app
paths:
  /api/v1/groups:
    get:
      summary: List my groups
      operationId: listGroups
      tags: [Groups]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The groups the signed-in user belongs to, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create a group
      description: The creator becomes the group's first admin.
      operationId: createGroup
      tags: [Groups]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/groups/{groupId}:
    get:
      summary: Get a group with its members and their roles
      operationId: getGroup
      tags: [Groups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The group. Every member can read it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/groups/{groupId}/invites:
    get:
      summary: List invite links that can still be used
      description: Admins only. Revoked and expired links are left out.
      operationId: listInvites
      tags: [Invites]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Usable invite links, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Create an invite link
      description: Admins only. The link expires after 7 days.
      operationId: createInvite
      tags: [Invites]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201":
          description: The new invite link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/groups/{groupId}/invites/{inviteId}:
    delete:
      summary: Revoke an invite link
      description: Admins only. A revoked link can no longer be used.
      operationId: revokeInvite
      tags: [Invites]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The link was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/invites/accept:
    post:
      summary: Join a group with an invite token
      description: >-
        Safe to call twice, because someone who is already a member is not added
        again. An unknown, expired or revoked token all give the same 410.
      operationId: acceptInvite
      tags: [Invites]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: The group that was joined.
          content:
            application/json:
              schema:
                type: object
                required: [groupId]
                properties:
                  groupId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: The invite link has expired or was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: INVITE_UNAVAILABLE
                  message: This invite link has expired or was revoked.
        "415":
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/me:
    get:
      summary: Get the signed-in user
      operationId: getMe
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, displayName]
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: [string, "null"]
                  displayName:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/groups/{groupId}/expenses:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listGroupExpenses
      summary: List group expenses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Expenses newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createGroupExpense
      summary: Add a group expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    GroupCreate:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        currency:
          type: string
          enum: [USD, EUR, GBP, CAD, AUD, INR]
    GroupSummary:
      type: object
      required: [id, name, currency, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        role:
          type: string
          enum: [admin, member]
          description: The signed-in user's role in this group.
    GroupMember:
      type: object
      required: [userId, displayName, role]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/GroupSummary"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/GroupMember"
    Invite:
      type: object
      required: [id, token, url, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    ExpenseShare:
      type: object
      required: [userId, amountCents]
      properties:
        userId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 0
    ExpenseCreate:
      type: object
      required:
        [amountCents, description, categoryId, expenseDate, paidBy, shares]
      properties:
        amountCents:
          type: integer
          minimum: 1
        description:
          type: string
          minLength: 1
        categoryId:
          type: [string, "null"]
          format: uuid
        expenseDate:
          type: string
          format: date
        paidBy:
          type: string
          format: uuid
        shares:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExpenseShare"
    Expense:
      allOf:
        - $ref: "#/components/schemas/ExpenseCreate"
        - type: object
          required: [id, groupId, createdBy, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            groupId:
              type: string
              format: uuid
            createdBy:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Forbidden:
      description: Only group admins can do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Group not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Invalid expense
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
