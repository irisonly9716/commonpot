openapi: 3.1.0
info:
  title: CommonPot API
  version: 0.1.0
  description: The CommonPot API will be documented here as endpoints are implemented.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.commonpot.app
paths:
  /api/v1/groups/{groupId}/expenses:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      summary: List group expenses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Expenses newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Add a group expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ExpenseShare:
      type: object
      required: [userId, amountCents]
      properties:
        userId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 0
    ExpenseCreate:
      type: object
      required:
        [amountCents, description, categoryId, expenseDate, paidBy, shares]
      properties:
        amountCents:
          type: integer
          minimum: 1
        description:
          type: string
          minLength: 1
        categoryId:
          type: [string, "null"]
          format: uuid
        expenseDate:
          type: string
          format: date
        paidBy:
          type: string
          format: uuid
        shares:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExpenseShare"
    Expense:
      allOf:
        - $ref: "#/components/schemas/ExpenseCreate"
        - type: object
          required: [id, groupId, createdBy, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            groupId:
              type: string
              format: uuid
            createdBy:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Group not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Invalid expense
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
