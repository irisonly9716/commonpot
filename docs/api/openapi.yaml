openapi: 3.1.0
info:
  title: CommonPot API
  version: 0.1.0
  description: The CommonPot API will be documented here as endpoints are implemented.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.commonpot.app
paths:
  /api/v1/groups/{groupId}/expenses:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listGroupExpenses
      summary: List group expenses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Expenses newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createGroupExpense
      summary: Add a group expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/groups/{groupId}/balances:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroupBalances
      summary: Get every member's balance and suggested settle-up payments
      description: >
        A balance is what a member paid for expenses minus their shares, plus
        payments made minus payments received. Positive means the member is
        owed money. Balances add up to zero. Settlements are a greedy plan
        with at most (members with a non-zero balance - 1) payments.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balances and suggested payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBalances"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/groups/{groupId}/balances/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getBalanceBreakdown
      summary: Get the expenses and payments behind one member's balance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The balance and the items behind it, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/groups/{groupId}/payments:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: recordGroupPayment
      summary: Record a payment between two members
      description: >
        Only the payer or the payee can record a payment. CommonPot records the
        payment; it never moves money.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/groups/{groupId}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/ExpenseId"
    patch:
      operationId: updateGroupExpense
      summary: Edit an expense
      description: >
        Only the person who logged the expense can edit it, whatever their role.
        The body replaces the whole expense, including its shares. The edit
        appears in the activity feed and balances recalculate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteGroupExpense
      summary: Delete an expense
      description: >
        The person who logged the expense or a group admin can delete it. When
        someone else deletes it, the person who logged it gets an in-app alert
        saying who deleted it and what it was. The deletion appears in the
        activity feed.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Expense deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/groups/{groupId}/activity:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listGroupActivity
      summary: List the group's activity feed
      description: >
        The latest 50 added, edited and deleted expenses and recorded payments,
        newest first, with who made each change.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Activity newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/alerts:
    get:
      operationId: listMyAlerts
      summary: List my in-app alerts
      description: The signed-in user's latest 50 alerts, newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          required: false
          description: Set to true to return only alerts that haven't been read.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Alerts newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/alerts/{alertId}:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    patch:
      operationId: updateMyAlert
      summary: Mark one of my alerts as read or unread
      description: Only the read state can change. Other users' alerts return 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertUpdate"
      responses:
        "200":
          description: Alert updated
          content:
            application/json:
              schema:
                type: object
                required: [id, readAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  readAt:
                    type: [string, "null"]
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ExpenseShare:
      type: object
      required: [userId, amountCents]
      properties:
        userId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 0
    ExpenseCreate:
      type: object
      required:
        [amountCents, description, categoryId, expenseDate, paidBy, shares]
      properties:
        amountCents:
          type: integer
          minimum: 1
        description:
          type: string
          minLength: 1
        categoryId:
          type: [string, "null"]
          format: uuid
        expenseDate:
          type: string
          format: date
        paidBy:
          type: string
          format: uuid
        shares:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExpenseShare"
    Expense:
      allOf:
        - $ref: "#/components/schemas/ExpenseCreate"
        - type: object
          required: [id, groupId, createdBy, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            groupId:
              type: string
              format: uuid
            createdBy:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    BalanceStatus:
      type: string
      enum: [owed, owes, settled]
      description: '"owed" means the group owes this member money; "owes" means the member owes the group.'
    MemberBalance:
      type: object
      required: [userId, displayName, balanceCents, status]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        balanceCents:
          type: integer
          description: Positive when the member is owed money, negative when they owe.
        status:
          $ref: "#/components/schemas/BalanceStatus"
    Settlement:
      type: object
      required: [fromUserId, toUserId, amountCents]
      properties:
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
    GroupBalances:
      type: object
      required: [currency, balances, settlements]
      properties:
        currency:
          type: string
          example: USD
        balances:
          type: array
          items:
            $ref: "#/components/schemas/MemberBalance"
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
    BreakdownItem:
      type: object
      required: [kind, id, date, description, effectCents]
      properties:
        kind:
          type: string
          enum: [expense, payment]
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        effectCents:
          type: integer
          description: How much this item moved the balance.
    BalanceBreakdown:
      allOf:
        - $ref: "#/components/schemas/MemberBalance"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BreakdownItem"
    PaymentCreate:
      type: object
      required: [paidBy, paidTo, amountCents, paymentDate]
      properties:
        paidBy:
          type: string
          format: uuid
        paidTo:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
        paymentDate:
          type: string
          format: date
        note:
          type: string
          maxLength: 200
    ActivityItem:
      type: object
      required:
        [id, action, description, amountCents, actorId, actorName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [added, edited, deleted, payment_recorded]
        description:
          type: string
          description: The expense description, or "Payer paid Payee" for a payment.
        amountCents:
          type: [integer, "null"]
        actorId:
          type: [string, "null"]
          format: uuid
        actorName:
          type: string
          description: Former member when the person has left the group.
        createdAt:
          type: string
          format: date-time
    Alert:
      type: object
      required: [id, groupId, kind, message, createdAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: [string, "null"]
          format: uuid
        kind:
          type: string
          description: For example expense_deleted.
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
    AlertUpdate:
      type: object
      required: [read]
      properties:
        read:
          type: boolean
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Group not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Not allowed for this user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: The request body must be application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
